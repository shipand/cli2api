name: Sync fork with upstream

on:
  schedule:
    # 每天 10:00 CST (02:00 UTC) 自动同步
    - cron: '0 2 * * *'
  # 允许在 GitHub 网页上手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/caigee-cmd/cli2api.git || true
          git fetch upstream main
          git checkout main
          # 仅快进合并（fork 是干净镜像，不应有分叉；若有分叉则失败而非制造混乱）
          git merge --ff-only upstream/main
          git push origin main
