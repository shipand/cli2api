name: Sync fork with upstream

on:
  schedule:
    # 每天 10:00 CST (02:00 UTC) 自动同步
    - cron: '0 2 * * *'
    # 允许在 GitHub 网页上手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync with upstream
        run: |
          git remote add upstream https://github.com/caigee-cmd/cli2api.git || true
          git fetch upstream main
          git checkout main
          # 上游没新提交就直接退出，不重写、不推送，避免每天空转触发部署
          if [ "$(git rev-list --count HEAD..upstream/main)" = "0" ]; then
            echo "Upstream has no new commits, nothing to sync."
            exit 0
          fi
                    # rebase 要重写提交，需要先设定提交者身份，否则报 empty ident
                              git config user.name "github-actions[bot]"
                                        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fork 是纯镜像：把本地提交 rebase 到上游最新之上，再推（force-with-lease 防止误覆盖）
          git rebase upstream/main
          git push --force-with-lease origin main
